{% for post in posts %}
    <div>
        <h1><a href="{{post.post-link}}">{{post.title}}</a>{{post.logseq-tags|safe}}</h1>
        {{post.body | safe}}
        {% if post.truncated %}
            <p><a href="{{post.post-link}}">Continue reading</a></p>
        {% endif %}
        {% if post.discuss %}
            <p>Discuss this post <a href="{{post.discuss}}">here</a>.</p>
        {% endif %}
    </div>
{% endfor %}
