    <script>
      // Sorts a table.sortable by the column whose header is clicked, toggling its order
      document.querySelectorAll("table.sortable th").forEach((th, i) => {
        th.addEventListener("click", () => {
          const asc = th.dataset.order !== "asc";
          th.parentElement.querySelectorAll("th").forEach(h => delete h.dataset.order);
          th.dataset.order = asc ? "asc" : "desc";
          const tbody = th.closest("table").tBodies[0];
          const text = row => row.cells[i].textContent.trim();
          [...tbody.rows]
            .sort((a, b) => (asc ? 1 : -1) * text(a).localeCompare(text(b), undefined, {numeric: true}))
            .forEach(row => tbody.appendChild(row));
        });
      });
    </script>
